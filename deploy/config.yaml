# ============================================================
# Archi 2026 — конфигурация гибридного агента
# Путь установки: /etc/archi/config.yaml
# Переменные окружения: ${VAR} и ${VAR:-default} раскрываются во всём файле.
# ============================================================

node_name: laptop          # как этот узел виден в метриках
timezone: Europe/Kyiv
data_dir: /var/lib/archi
log_level: info            # debug | info | warn | error

# ---------- LLM (antigravity-claude-proxy на agrobot-prod, доступен через SSH-туннель) ----------
llm:
  base_url: http://127.0.0.1:18080   # туннель до 35.209.212.217:18080 (см. archi-tunnel.service)
  api_key: local-proxy
  model: claude-sonnet-4-5
  max_tokens: 4096
  timeout: 120s
  max_retries: 4
  # Failover-цепочка (2026.13): когда основной исчерпал ретраи, запрос уходит
  # сюда — другая точка входа той же Anthropic-совместимой формы.
  # providers:
  #   - base_url: https://api.anthropic.com
  #     api_key: ${ANTHROPIC_API_KEY:-}
  #     model: claude-sonnet-4-5

# ---------- Ядро ReAct ----------
agent:
  max_steps: 24                # защита от зацикливания
  history_limit: 40
  compact_after_chars: 150000  # порог компактизации истории
  idle_session_ttl: 12h
  backoff_base: 1s
  backoff_max: 30s
  max_tool_parallel: 4         # параллельные вызовы инструментов

# ---------- Мост (телеметрия + SSH + watchdog) ----------
bridge:
  interval: 30s               # цикл сбора метрик
  remote_timeout: 20s
  command_timeout: 120s
  max_output_bytes: 262144    # 256 KiB на команду

  remote:
    host: agrobot-prod         # alias из ~/.ssh/config (или IP 35.209.212.217)
    user: archi
    port: 22
    key_path: ~/.ssh/id_ed25519
    known_hosts: ~/.ssh/known_hosts
    strict_host_key: true
    pool_size: 3               # параллельные SSH-соединения
    connect_timeout: 10s
    keepalive_interval: 15s
    max_retries: 3

  watchdog:
    auto_restart:              # сервисы на VM, рестартуемые автоматически
      - console-bot
    restart_cooldown: 5m

# ---------- Пороги тревог ----------
alerts:
  ram_percent: 85
  cpu_percent: 80
  disk_percent: 90
  cooldown: 10m
  services:                    # мониторятся на ОБЕИХ нодах
    - console-bot              # systemd-юнит старого бота на VM
    - postgresql
    - sshd

# ---------- Инструменты (политики безопасности) ----------
tools:
  max_read_bytes: 262144
  allowed_write_dirs:
    - /home
    - /tmp
    - /var/lib/archi
    - /srv
  allowed_restart_services:
    - console-bot
    - agrobot
    - info-bot
    - archi
  # Жёсткий запрет — никогда не исполняется (жёсткий fail).
  bash_deny_patterns:
    - 'rm\s+-rf?\s+/(?:\s|$)'
    - 'mkfs'
    - 'dd\s+.*of=/dev/'
    - ':\(\)\s*\{.*\};:'
    - 'shutdown|reboot|halt|poweroff'
    - '>\s*/dev/sd'
    - 'chmod\s+-R\s+777\s+/'
    - '--no-preserve-root'
    - 'find\s+/\s.*-delete'
    - 'curl[^|]*\|\s*(ba)?sh\b'
    - 'wget[^|]*\|\s*(ba)?sh\b'
  # Опасное — спросить владельца в Telegram (✅/❌) перед исполнением.
  # Нет ответа за approval_timeout = отказ (fail-closed).
  approval_patterns:
    - 'systemctl\s+(restart|stop|start|disable|enable|mask)'
    - '\brm\s+-[a-zA-Z]*[rRf]'
    - '\b(pkill|killall)\b'
    - '\bkill\s+-?\d'
    - '\bchmod\b.*\s/etc/'
    - '\bchown\b.*\s/etc/'
    - '\b(iptables|ufw)\b'
    - '(?i)\bdrop\s+(table|database)\b'
    - '\bgit\s+push\b'
  approval_timeout: 2m
  forbidden_read_patterns:
    - '/etc/shadow'
    - '/etc/gshadow'
    - '\.ssh/'
    - 'id_rsa'
    - 'id_ed25519'
    - '\.pem$'
    - '\.key$'
    - 'credentials\.json$'

# ---------- Telegram ----------
telegram:
  enabled: true
  api_base: https://api.telegram.org
  token: ${TELEGRAM_BOT_TOKEN}
  allowed:                     # allowlist: только эти пользователи могут писать боту
    - 000000000                # ← замени на свой Telegram user ID
  admins:                      # получают тревоги и сводки
    - 000000000
  poll_timeout: 50s
  digest:
    enabled: true
    times: ["09:00", "21:00"]  # утренняя и вечерняя сводки
    chats: []                  # пусто = admins

# ---------- Локальный IPC (UNIX-сокет для `archi ctl`) ----------
ipc:
  enabled: true
  socket_path: /run/archi/archi.sock

# ---------- Долговременная память ----------
memory:
  dir: /var/lib/archi/memory   # memory.jsonl + skills/
  recall_limit: 8
  max_entries: 5000
  # Семантический recall: векторы записей через OpenAI-совместимый /embeddings.
  # Выключено — работает гибридный keyword-recall (как раньше).
  embeddings:
    enabled: false
    base_url: https://api.openai.com/v1
    api_key: ${OPENAI_API_KEY:-}
    model: text-embedding-3-small
    timeout: 15s

# ---------- Само-пишущиеся навыки (2026.13) ----------
# Агент сохраняет удачные процедуры (skill_save) в memory/skills/*.md
# и переиспользует их: релевантные подмешиваются в системный промпт.
skills:
  enabled: true
  inject_limit: 2              # сколько навыков подмешивать в промпт

# ---------- Observability (2026.13) ----------
# Prometheus-текстовый эндпоинт + healthcheck. Только localhost!
observability:
  enabled: true
  metrics_addr: 127.0.0.1:9109  # curl 127.0.0.1:9109/metrics

# ---------- Браузерный инструмент (2026.13) ----------
# Headless Chromium через CDP: JS-рендеринг + скриншоты для SPA-дашбордов.
# Требует: sudo apt install chromium-browser (или chrome_bin явно).
browser:
  enabled: false
  chrome_bin: ""              # "" = авто-детект chromium/google-chrome
  timeout: 60s
  max_text_bytes: 262144

# ---------- Голосовой интерфейс (2026.12) ----------
# STT — OpenAI-совместимый POST {base_url}/audio/transcriptions (multipart).
# Основной: Groq (быстро, дёшево). Фолбэк: локальный whisper.cpp на 127.0.0.1:9000 —
# работает оффлайн (см. deploy/archi-whisper.service), включается автоматически,
# когда основной недоступен (сеть/ключ/лимиты). Один клиент — любой провайдер.
voice:
  stt:
    enabled: false              # включи после настройки ключа: voice.stt.enabled: true
    base_url: https://api.groq.com/openai/v1
    api_key: ${GROQ_API_KEY:-}   # для локального сервера можно оставить пустым
    model: whisper-large-v3-turbo
    language: ru                # пусто = автоопределение (лучше для микса ru/ua/en)
    convert: auto               # auto|always|never — ogg→wav 16кГц для локальных серверов
    timeout: 60s
    max_bytes: 20971520         # 20 МБ (потолок Telegram Bot API)
    # Резервный провайдер (обычно локальный whisper.cpp server).
    # Отдельно задавать не обязательно: если archi-whisper.service не запущен,
    # фолбэк просто не сработает и вернётся ошибка основного.
    fallback:
      base_url: http://127.0.0.1:9000
      model: small-q5_0         # имя модели у whisper.cpp server
      convert: auto             # localhost → сам сконвертирует в WAV 16кГц
      timeout: 120s            # локальному на i5-6200U нужно 3-5x realtime

  # Микрофон ноутбука — для команды `archi voice`.
  mic:
    backend: auto               # auto|arecord|ffmpeg|parecord
    device: default             # default | hw:0,0 | имя pulse-источника
    sample_rate: 16000         # то, что любит Whisper
    max_duration: 120s         # protect-таймер от забытой записи

  # TTS — опциональная озвучка ответов.
  # Провайдер openai (облако, /audio/speech) или piper (локальный офлайн,
  # ставится скриптом deploy/setup-piper.sh; голоса: irina / ruslan / dmitri).
  # Формат opus → отправляется в Telegram как голосовое (sendVoice).
  tts:
    enabled: false
    provider: openai            # openai | piper
    base_url: https://api.openai.com/v1
    api_key: ${OPENAI_API_KEY:-}
    model: gpt-4o-mini-tts
    voice: alloy                # для piper не используется
    format: opus
    timeout: 60s
    max_chars: 1000             # более длинные ответы не озвучиваются
    piper:                      # используется только при provider: piper
      bin: /opt/piper/piper
      model: /opt/piper/ru_RU-irina-medium.onnx
      timeout: 30s

# ---------- Ear: hands-free голос (2026.13) ----------
# Отдельный слушатель `archi ear` (deploy/archi-ear.service): ловит «Арчи, …»
# в эфире, шлёт команду демону через IPC и отвечает голосом (нужен TTS).
# Полудуплекс с barge-in: громкая речь перебивает озвучку.
# Требует: ipc.enabled=true + voice.stt.enabled=true (проверяет check-config).
ear:
  enabled: false               # включи вместе с archi-ear.service
  wake_words: ["арчи", "archi"]
  max_utterance: 20s           # жёсткий лимит фразы
  cooldown: 4s                 # анти-эхо после собственного ответа
  barge_in: true               # перебивать озвучку громкой речью
  vad:                         # энергия-RMS: без моделей, чистый Go
    frame_ms: 30               # окно анализа
    start_factor: 3.2          # RMS > пол×фактор → речь началась
    stop_factor: 1.9           # RMS < пол×фактор → тишина
    min_speech_ms: 320          # короче — клик/шум, не фраза
    silence_ms: 1100            # тишина, закрывающая фразу
    noise_learn_s: 2            # калибровка шума при старте (сек)

# ---------- Cron: проактивные задания агента (2026.12) ----------
# Агент сам просыпается по расписанию и выполняет задачу через полный ReAct-цикл.
# Результат приходит админам в Telegram + сохраняется в память как episode.
# Рекомендуемые промпты уже содержат контекст — но подправь под свои сервисы.
cron:
  enabled: false               # включи, когда промпты устраивают
  jobs:
    - name: morning-check
      times: ["09:05"]         # ежедневно в 09:05 (либо every: 6h — но не оба)
      prompt: "Утренняя проверка: собери статус обеих нод (node_status), проверь services из алертов, кратко резюмируй аномалии и риски на сегодня. Если всё в норме — так и скажи, одной фразой."
      timeout: 5m
      notify: true
    - name: disk-hygiene
      every: 6h
      prompt: "Проверь заполнение диска на обеих нодах и объём журналов journald. Если диск занят >80% — предложи план очистки (без исполнения деструктивного, только план)."
      timeout: 5m
      notify: false
    - name: memory-review
      times: ["21:30"]
      prompt: "Вечерний обзор: прочитай недавние записи долговременной памяти (memory_recall 'инцидент'), выдели незакрытые темы/обещания и предложи список задач на завтра."
      timeout: 5m
      notify: true
